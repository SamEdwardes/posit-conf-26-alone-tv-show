[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.6"
hooks = [
  {
    id = "ruff-check",
    args = [
      "--fix",
      "--select",
      "I,F401",
    ]
  },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.10.11"
hooks = [
  { id = "uv-export", args = [
    "--frozen",
    "--no-hashes",
    "--output-file=requirements.txt",
  ] },
]

[[repos]]
repo = "local"
# Regenerates manifest.json when any file the manifest checksums changes.
hooks = [
  {
    id = "generate-connect-manifest",
    name = "Generate Connect Manifest",
    language = "system",
    entry = "uv run rsconnect write-manifest shiny",
    args = [
      ".",
      "--overwrite",
      "--requirements-file",
      "requirements.txt",
      "--exclude",
      ".ruff_cache/",
      "--exclude",
      ".posit/publish/",
      "--exclude",
      "AGENTS.md",
      "--exclude",
      "CLAUDE.md",
      "--exclude",
      "README.md",
      "--exclude",
      "prek.toml",
    ],
    files = { glob = [
      "**/*.py",
      "uv.lock",
      "pyproject.toml",
      ".python-version",
      "data/**",
    ] },
    pass_filenames = false
  },
]
